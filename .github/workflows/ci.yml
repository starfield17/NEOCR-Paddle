name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: dotnet restore NEOCR.Paddle.slnx
      - run: dotnet build NEOCR.Paddle.slnx --no-restore
      - run: python tools/verify_manifest.py manifests/models/pp-ocrv5-mobile-full-v1.json
      - run: python -m unittest discover -s tests -v
      - run: dotnet format NEOCR.Paddle.slnx --no-restore --verify-no-changes
      - run: dotnet list NEOCR.Paddle.slnx package --vulnerable --include-transitive
