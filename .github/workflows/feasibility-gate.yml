name: feasibility-gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-gate.txt
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-gate.txt
      - run: paddlex --install paddle2onnx
      - name: Convert and capture Paddle references
        env:
          PADDLE_PDX_MODEL_SOURCE: BOS
        run: >-
          python tools/run_source_gate.py
          --manifest manifests/models/pp-ocrv5-mobile-full-v1.json
          --cache .cache/gate
          --output artifacts/gate-bundle
      - run: python -m pip freeze > artifacts/gate-bundle/python-lock.txt
      - run: dotnet run --project src/NEOCR.Paddle.Gate -- validate-bundle artifacts/gate-bundle
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gate-bundle
          path: artifacts/gate-bundle
          if-no-files-found: warn
          retention-days: 14

  cross-platform-parity:
    needs: source-gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v7
        with:
          name: gate-bundle
          path: artifacts/gate-bundle
      - run: dotnet run --project src/NEOCR.Paddle.Gate -- validate-bundle artifacts/gate-bundle
